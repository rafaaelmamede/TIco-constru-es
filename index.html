<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tico Material de Construção · Caixa e Estoque</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;--bg:#EEF0F3;--surface:#FFFFFF;--field:#F4F5F8;--ink:#14233B;--muted:#5F6B7A;--line:#D3D8E0;--accent:#0B2F6B;--on-accent:#FFFFFF;--hdr:#0B2F6B;--on-hdr:#FFFFFF;--danger:#B3203A;--ok:#1B7A4B;--hz:#AEB6C2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow-x:hidden}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:700;letter-spacing:.01em}
h2{font-size:1.25rem;margin:26px 0 10px;text-transform:uppercase;letter-spacing:.06em}
p{margin:0}.muted{color:var(--muted)}small{color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{background:var(--hdr);color:var(--on-hdr);border-bottom:8px solid transparent;border-image:repeating-linear-gradient(-45deg,var(--hz) 0 14px,#fff 14px 28px) 8}
.hin{max-width:1080px;margin:0 auto;padding:16px 16px 0}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.hlogo{width:48px;height:48px;border-radius:10px;background:#fff;object-fit:contain;flex:none}
.brand h1{margin:0;font-size:2rem;line-height:1;text-transform:uppercase}.brand span{color:var(--hz);font-weight:600;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;gap:4px;margin-top:14px}
nav a{flex:1;max-width:200px;text-align:center;padding:11px 8px;color:var(--on-hdr);text-decoration:none;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;border-radius:8px 8px 0 0;opacity:.7}
nav a[aria-current=page]{background:var(--bg);color:var(--ink);opacity:1}
main{max-width:1080px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 56px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:2rem;line-height:1.1}
.stat.main{border-left:6px solid var(--accent)}
.up{color:var(--ok)}.down{color:var(--danger)}
label{display:block;font-weight:600;margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;background:var(--field);font-size:1rem}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.r3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:1.05rem;text-transform:uppercase;letter-spacing:.05em}
.btn.alt{background:none;color:var(--accent);border:1.5px solid var(--accent)}
.btn.dng{background:none;color:var(--danger);border:1.5px solid var(--danger)}.btn.dng[data-armed]{background:var(--danger);color:var(--surface)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-bottom:6px}
.seg button,.chip{padding:11px 6px;border:1.5px solid var(--line);border-radius:8px;background:var(--field);font-weight:600}
.seg button[aria-pressed=true],.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.item small{display:block}.item .v{text-align:right;flex:none}
.rm{background:none;border:0;padding:6px 0 6px 8px;color:var(--muted);text-decoration:underline;font-size:.9rem}.rm[data-armed]{color:var(--danger);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.tag{margin-left:8px;padding:2px 8px;border-radius:99px;background:var(--danger);color:#fff;font-size:.72rem;font-weight:600;vertical-align:middle}
.msg{min-height:1.4em;margin-top:8px;font-weight:600}.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
.note{padding:12px 14px;border-radius:10px;border:1.5px dashed var(--line);background:var(--surface)}
.qty{font-family:"Barlow Condensed",sans-serif;font-size:1.7rem;line-height:1;text-align:right}.qty small{font-family:"Barlow",sans-serif;font-size:.85rem}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.panel{margin-top:10px;padding-top:6px;border-top:1px solid var(--line)}
.irow{padding:12px 0;border-bottom:1px solid var(--line)}.irow .sub{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:6px;margin-top:6px;align-items:center}
.two{display:grid;gap:0 28px;grid-template-columns:1fr}
@media (min-width:900px){.two{grid-template-columns:1fr 1fr;align-items:start}}
@media (max-width:520px){.irow .sub{grid-template-columns:1fr 1fr}.chips{grid-template-columns:repeat(2,1fr)}.r3{grid-template-columns:1fr 1fr}.r3 :first-child{grid-column:1/-1}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,14px);padding:11px 18px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:600;opacity:0;pointer-events:none;transition:.18s;z-index:9;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
textarea{height:90px;font-size:.8rem;font-family:ui-monospace,monospace}
.home{text-align:center;padding-top:10px}
.logo{width:min(250px,64vw);margin:6px auto 16px;border-radius:24px;background:#fff;overflow:hidden;line-height:0;box-shadow:0 6px 18px rgba(11,47,107,.2)}
.logo img{width:100%;height:auto;display:block}
.home h1{font-size:2.6rem;line-height:1.05;margin:0 0 6px;color:var(--accent);text-transform:uppercase}
.hgrid{display:grid;gap:16px;margin:30px auto 0;max-width:820px;grid-template-columns:1fr}
.hbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;padding:24px 18px;border-radius:16px;background:var(--accent);color:var(--on-accent);text-decoration:none;box-shadow:0 4px 0 #061C42}
.hbtn b{font-family:"Barlow Condensed",sans-serif;font-size:2rem;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.hbtn span{font-size:.95rem;opacity:.85}
.hbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #061C42}
@media (hover:hover){.hbtn:hover{filter:brightness(1.15)}}
@media (min-width:700px){.hgrid{grid-template-columns:1fr 1fr}.hbtn{min-height:190px}}
</style>
</head>

function totals(pays,fundo){var m={},i=0,o=0;METHODS.forEach(function(k){m[k]=0});
  pays.forEach(function(p){if(p.type==='in'){m[p.method]=r2(m[p.method]+p.value);i+=p.value}else o+=p.value});
  return {m:m,inn:r2(i),out:r2(o),cash:r2(fundo+m.Dinheiro-o)}}

/* ---------- estado de tela ---------- */
var view='caixa',tab='in',meth='Dinheiro',cart=[],draft={sp:'',sq:'',sv:'',sd:'',oc:OUTC[0],ov:'',od:''},
    st='saldo',op=null,q='',sx={q:'',n:'',p:'',pay:true},msg={},openDay='';
function route(){var h=(location.hash||'').replace('#','');view=['caixa','estoque','historico'].indexOf(h)>-1?h:'home';render()}

/* ---------- CAIXA ---------- */
function caixa(){
  if(!S.open)return '<div class="card" style="max-width:520px"><h2 style="margin-top:0">Caixa fechado</h2><p class="muted">Informe o troco inicial na gaveta e abra o caixa para lançar vendas e saídas.</p><label for="fundo">Fundo de troco (R$)</label><input id="fundo" inputmode="decimal" placeholder="0,00"><button class="btn" data-a="open">Abrir caixa</button><div class="msg err" id="m1"></div></div>'+
    (S.days.length?'<p class="muted" style="margin-top:14px">Último fechamento: '+dt(S.days[0].until)+' · '+brl(totals(S.days[0].pays,S.days[0].fundo).inn)+' em vendas.</p>':'');
  var T=totals(S.pays,S.open.fundo);
  var stats='<div class="grid"><div class="card stat main"><small>Dinheiro na gaveta</small><b>'+brl(T.cash)+'</b></div><div class="card stat"><small>Entradas</small><b class="up">'+brl(T.inn)+'</b></div><div class="card stat"><small>Saídas</small><b class="down">'+brl(T.out)+'</b></div><div class="card stat"><small>Lançamentos</small><b>'+S.pays.length+'</b></div></div>';
  var rows=METHODS.map(function(k){var p=T.inn?Math.round(T.m[k]/T.inn*100):0;return '<div style="padding:8px 0"><div class="item" style="padding:0;border:0"><span>'+k+' · '+p+'%</span><b>'+brl(T.m[k])+'</b></div><div class="bar"><i style="width:'+p+'%"></i></div></div>'}).join('');
  var form='<div class="card"><div class="seg"><button data-a="tab" data-t="in" aria-pressed="'+(tab==='in')+'">Venda</button><button data-a="tab" data-t="out" aria-pressed="'+(tab==='out')+'">Saída</button></div>'+(tab==='in'?saleForm():outForm())+'</div>';
  var list=S.pays.length?S.pays.map(payRow).join(''):'<p class="muted">Nenhum lançamento neste caixa.</p>';
  return '<p class="muted" style="margin-bottom:12px">Aberto em '+dt(S.open.since)+' às '+hm(S.open.since)+' · troco inicial '+brl(S.open.fundo)+'</p>'+stats+
  '<div class="two"><div><h2>Novo lançamento</h2>'+form+'</div><div><h2>Por forma de pagamento</h2><div class="card">'+rows+'</div></div></div>'+
  '<h2>Lançamentos</h2><div class="card">'+list+'</div><button class="btn dng" data-a="close" data-label="Fechar caixa" style="max-width:340px">Fechar caixa</button><p class="muted" style="margin-top:6px">O caixa é arquivado no Histórico e os totais recomeçam do zero.</p>';
}
function cartTotal(){return r2(cart.reduce(function(t,c){return t+c.q*(item(c.id)||{price:0}).price},0))}
function saleForm(){
  var opts='<option value="">Escolha o produto (opcional)</option>'+S.items.filter(function(i){return i.price>0}).map(function(i){return '<option value="'+i.id+'"'+(draft.sp===i.id?' selected':'')+'>'+esc(i.name)+' · '+fq(S.stock[i.id]||0)+' '+esc(i.unit)+' · '+brl(i.price)+'</option>'}).join('');
  var cl=cart.map(function(c){var it=item(c.id);return '<div class="item"><div><b>'+esc(it.name)+'</b><small>'+fq(c.q)+' '+esc(it.unit)+' × '+brl(it.price)+'</small></div><div class="v"><b>'+brl(r2(c.q*it.price))+'</b><button class="rm" data-a="rmcart" data-id="'+c.id+'">tirar</button></div></div>'}).join('');
  return '<label for="sp">Itens do estoque (baixa automática)</label><select id="sp">'+opts+'</select><div class="r2" style="margin-top:8px"><input id="sq" inputmode="decimal" placeholder="Quantidade" value="'+esc(draft.sq)+'" aria-label="Quantidade"><button class="btn alt" style="margin:0" data-a="addcart">Adicionar</button></div>'+cl+
  (cart.length?'<div class="item"><b>Total dos itens</b><b class="num" style="font-size:1.6rem">'+brl(cartTotal())+'</b></div>':'<label for="sv">Valor da venda (R$)</label><input id="sv" inputmode="decimal" placeholder="0,00" value="'+esc(draft.sv)+'"><small>Use quando não for baixar itens do estoque.</small>')+
  '<label for="sd">Cliente ou descrição</label><input id="sd" autocomplete="off" placeholder="Ex.: José – obra Rua 5" value="'+esc(draft.sd)+'"><label id="lm">Forma de pagamento</label><div class="chips" role="group" aria-labelledby="lm">'+METHODS.map(function(m){return '<button type="button" class="chip" data-a="meth" data-m="'+m+'" aria-pressed="'+(meth===m)+'">'+m+'</button>'}).join('')+'</div><button class="btn" data-a="sell">Registrar venda</button><div class="msg err" id="m1"></div>';
}
function outForm(){
  return '<label for="ov">Valor (R$)</label><input id="ov" inputmode="decimal" placeholder="0,00" value="'+esc(draft.ov)+'"><label for="oc">Motivo</label><select id="oc">'+OUTC.map(function(c){return '<option'+(draft.oc===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select><label for="od">Observação</label><input id="od" autocomplete="off" placeholder="Ex.: frete do cimento" value="'+esc(draft.od)+'"><button class="btn" data-a="spend">Registrar saída</button><div class="msg err" id="m1"></div>';
}
function payRow(p){
  var sale=p.type==='in',det=(p.items&&p.items.length)?p.items.map(function(i){return fq(i.q)+' '+esc(i.u)+' '+esc(i.n)}).join(', '):'';
  return '<div class="item"><div><b>'+(sale?'Venda':esc(p.cat||'Saída'))+'</b>'+(p.desc?' · '+esc(p.desc):'')+'<small>'+(sale?p.method+' · ':'')+hm(p.ts)+(det?' · '+det:'')+'</small></div><div class="v"><b class="'+(sale?'up':'down')+'">'+(sale?'+':'−')+brl(p.value)+'</b>'+(p.hist?'':'<button class="rm" data-a="rmpay" data-id="'+p.id+'" data-label="Remover">Remover</button>')+'</div></div>';
}
function addCart(){
  var it=item(draft.sp),v=pv(draft.sq||'1'),m=document.getElementById('m1');
  if(!it){m.textContent='Escolha um produto.';return}
  if(!(v>0)){m.textContent='Informe uma quantidade maior que zero.';return}
  var ex=cart.filter(function(c){return c.id===it.id})[0],tot=r3((ex?ex.q:0)+v);
  if(tot>(S.stock[it.id]||0)+1e-9){m.textContent='Estoque insuficiente: há '+fq(S.stock[it.id]||0)+' '+it.unit+'.';return}
  if(ex)ex.q=tot;else cart.push({id:it.id,q:v});draft.sq='';draft.sp='';render();
}
function sell(){
  var m=document.getElementById('m1'),val,items=[];
  if(cart.length){val=cartTotal();items=cart.map(function(c){var it=item(c.id);return {id:c.id,q:c.q,p:it.price,n:it.name,u:it.unit}})}
  else{val=pv(draft.sv);if(!(val>0)){m.textContent='Informe o valor da venda ou adicione itens.';return}val=r2(val)}
  S.pays.unshift({id:uid(),ts:Date.now(),type:'in',method:meth,value:val,desc:draft.sd.trim(),items:items});
  items.forEach(function(i){mv(i.id,'sale',-i.q,i.q,'Venda'+(draft.sd?' · '+draft.sd.trim():''))});
  cart=[];draft.sv='';draft.sd='';draft.sp='';save();render();toast('Venda registrada · '+brl(val));
}
function spend(){
  var m=document.getElementById('m1'),v=pv(draft.ov);
  if(!(v>0)){m.textContent='Informe o valor da saída.';return}
  S.pays.unshift({id:uid(),ts:Date.now(),type:'out',value:r2(v),cat:draft.oc,desc:draft.od.trim()});
  draft.ov='';draft.od='';save();render();toast('Saída registrada · '+brl(r2(v)));
}
function rmPay(id){
  var p=S.pays.filter(function(x){return x.id===id})[0];if(!p)return;
  (p.items||[]).forEach(function(i){mv(i.id,'undo',i.q,i.q,'Venda removida')});
  S.pays=S.pays.filter(function(x){return x.id!==id});save();render();toast('Lançamento removido.');
}

/* ---------- ESTOQUE ---------- */
function estoque(){
  var val=S.items.reduce(function(t,i){return t+(S.stock[i.id]||0)*(i.cost||0)},0),nl=S.items.filter(low).length;
  var sum='<div class="grid" style="margin-bottom:14px"><div class="card stat"><small>Produtos</small><b>'+S.items.length+'</b></div><div class="card stat"><small>Abaixo do mínimo</small><b class="'+(nl?'down':'')+'">'+nl+'</b></div><div class="card stat main"><small>Valor em estoque (custo)</small><b>'+brl(r2(val))+'</b></div></div>';
  var seg='<div class="seg">'+[['saldo','Saldo'],['novo','+ Novo item'],['movs','Movimentos'],['itens','Produtos']].map(function(t){return '<button data-a="st" data-t="'+t[0]+'" aria-pressed="'+(st===t[0])+'">'+t[1]+'</button>'}).join('')+'</div>';
  var body=st==='novo'?novoHtml():st==='movs'?movsHtml():st==='itens'?itensHtml():'<input id="q" type="search" placeholder="Pesquisar produto (ex.: cimento, tubo)" autocomplete="off" value="'+esc(q)+'" aria-label="Pesquisar produto"><div id="list" style="margin-top:12px">'+stockList()+'</div>';
  return sum+seg+'<div style="margin-top:10px">'+body+'</div>';
}
function stockList(){
  var t=norm(q).split(/\s+/).filter(Boolean),h='',any=false;
  CATS.forEach(function(c){var l=S.items.filter(function(i){var n=norm(i.name+' '+i.cat);return i.cat===c&&t.every(function(x){return n.indexOf(x)>-1})});if(!l.length)return;any=true;h+='<h2>'+c+'</h2>'+l.map(stCard).join('')});
  return any?h:'<div class="note">Nenhum produto encontrado.</div>';
}
function stCard(it){
  var n=S.stock[it.id]||0,o=op&&op.id===it.id?op.t:'',lab={in:'Quantidade que entrou',out:'Quantidade que saiu',set:'Quantidade contada agora'}[o];
  var acts=['in','out','set'].map(function(t){return '<button class="chip" data-a="sa" data-id="'+it.id+'" data-t="'+t+'" aria-pressed="'+(o===t)+'">'+TL[t]+'</button>'}).join('');
  var panel=o?'<div class="panel"><label for="sq2">'+lab+' ('+esc(it.unit)+')</label><input id="sq2" inputmode="decimal" value="'+esc(sx.q)+'">'+
   (o==='in'?'<label for="sp2">Valor pago (R$), opcional</label><input id="sp2" inputmode="decimal" placeholder="Total da compra" value="'+esc(sx.p)+'"><small>'+(it.cost>0?'Custo atual: '+brl(it.cost)+' por '+esc(it.unit)+'. ':'')+'O custo médio é recalculado quando você informa o valor.</small>'+(S.open?'<label style="display:flex;gap:10px;align-items:center;font-weight:500"><input type="checkbox" id="sk2" style="width:22px;height:22px"'+(sx.pay?' checked':'')+'>Lançar como saída no caixa</label>':''):'')+
   '<label for="sn2">Observação</label><input id="sn2" autocomplete="off" value="'+esc(sx.n)+'"><button class="btn" data-a="sok">Confirmar '+TL[o].toLowerCase()+'</button><div class="msg err" id="m1"></div></div>':'';
  return '<div class="card" style="margin-bottom:10px"><div class="item" style="border:0;padding:0"><div><b>'+esc(it.name)+'</b>'+(low(it)?'<span class="tag">baixo</span>':'')+'<small>'+(it.min>0?'Mínimo '+fq(it.min)+' '+esc(it.unit):'Sem mínimo')+(it.price>0?' · Venda '+brl(it.price):'')+'</small></div><div class="qty">'+fq(n)+' <small>'+esc(it.unit)+'</small></div></div><div class="acts">'+acts+'</div>'+panel+'</div>';
}
function confirmMove(){
  var it=item(op.id),m=document.getElementById('m1'),v=pv(sx.q),t=op.t,cur=S.stock[it.id]||0;
  if(v===null||(t!=='set'&&v<=0)){m.textContent=t==='set'?'Informe a quantidade contada (pode ser 0).':'Informe uma quantidade maior que zero.';return}
  if(t==='out'&&v>cur+1e-9){m.textContent='Estoque insuficiente: há '+fq(cur)+' '+it.unit+'. Use Contagem para corrigir o saldo.';return}
  var paid=0;if(t==='in'&&sx.p.trim()!==''){paid=pv(sx.p);if(!(paid>0)){m.textContent='Valor pago inválido.';return}}
  var d=t==='in'?v:t==='out'?-v:r3(v-cur),extra='';
  if(paid>0){var bs=Math.max(cur,0),up=paid/v,nc=(it.cost>0&&bs>0)?(bs*it.cost+v*up)/(bs+v):up;it.cost=Math.round(nc*10000)/10000;extra=' Custo médio: '+brl(it.cost)+'.';
    if(S.open&&sx.pay)S.pays.unshift({id:uid(),ts:Date.now(),type:'out',value:r2(paid),cat:'Fornecedor',desc:'Compra: '+it.name})}
  mv(it.id,t,d,v,sx.n.trim(),paid);save();op=null;sx={q:'',n:'',p:'',pay:true};render();toast(TL[t]+' registrada: '+it.name+'.'+extra);
}
function movsHtml(){
  if(!S.movs.length)return '<div class="note">Nenhuma movimentação registrada ainda.</div>';
  return '<div class="card">'+S.movs.map(function(m){var sg=m.delta>0?'+':m.delta<0?'−':'';
    return '<div class="item"><div><b>'+esc(m.name)+'</b><small>'+TL[m.type]+(m.type==='set'?' (contado '+fq(m.qty)+')':'')+' · '+new Date(m.ts).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+hm(m.ts)+(m.paid>0?' · pago '+brl(m.paid):'')+(m.note?' · '+esc(m.note):'')+'</small></div><b class="'+(m.delta>0?'up':m.delta<0?'down':'')+'">'+sg+fq(Math.abs(m.delta))+' '+esc(m.unit||'')+'</b></div>'}).join('')+'</div><p class="muted" style="margin-top:8px">Últimas 300 movimentações.</p>';
}
function novoHtml(){
  var us=['un','sc','m³','kg','L','cx','br','rl','m','pç'];
  return '<div class="card" style="max-width:640px"><h2 style="margin-top:0">Adicionar item ao estoque</h2><label for="nn">Nome do item</label><input id="nn" autocomplete="off" placeholder="Ex.: Cimento CP-III 50 kg"><div class="r2"><div><label for="nc">Categoria</label><select id="nc">'+CATS.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select></div><div><label for="nu">Unidade</label><input id="nu" list="ul" autocomplete="off" placeholder="un, sc, m³, kg…"><datalist id="ul">'+us.map(function(u){return '<option value="'+u+'">'}).join('')+'</datalist></div></div><div class="r2"><div><label for="nq">Quantidade em estoque agora</label><input id="nq" inputmode="decimal" placeholder="0"></div><div><label for="nm">Estoque mínimo (aviso)</label><input id="nm" inputmode="decimal" placeholder="Opcional"></div></div><div class="r2"><div><label for="nk">Custo por unidade (R$)</label><input id="nk" inputmode="decimal" placeholder="Quanto você paga"></div><div><label for="np">Preço de venda (R$)</label><input id="np" inputmode="decimal" placeholder="Quanto você cobra"></div></div><small>Só itens com preço de venda aparecem na tela de vendas do caixa. Dá para ajustar tudo depois na aba Produtos.</small><button class="btn" data-a="nadd">Adicionar ao estoque</button><div class="msg err" id="m1"></div></div>';
}
function newItem(){
  function g(i){return document.getElementById(i).value.trim()}
  var m=document.getElementById('m1'),n=g('nn'),u=g('nu')||'un';
  function num(i,l){var s=g(i);if(s==='')return 0;var v=pv(s);if(v===null||v<0){m.textContent=l+' inválido.';return null}return v}
  if(!n){m.textContent='Informe o nome do item.';return}
  if(S.items.some(function(i){return norm(i.name)===norm(n)})){m.textContent='Já existe um item com esse nome.';return}
  var q0=num('nq','Quantidade'),mn=num('nm','Mínimo'),ck=num('nk','Custo'),pr=num('np','Preço');
  if(q0===null||mn===null||ck===null||pr===null)return;
  var id='i'+Date.now();S.items.push({id:id,name:n,cat:g('nc'),unit:u,min:r3(mn),cost:r2(ck),price:r2(pr)});S.stock[id]=0;
  if(q0>0)mv(id,'in',r3(q0),r3(q0),'Estoque inicial',0);
  save();render();toast('Item adicionado: '+n);var f=document.getElementById('nn');if(f)f.focus();
}
function itensHtml(){
  var add='<div class="card" style="margin-bottom:12px"><label for="xn" style="margin-top:0">Novo produto</label><input id="xn" autocomplete="off" placeholder="Nome"><div class="r2" style="margin-top:8px"><select id="xc" aria-label="Categoria">'+CATS.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select><input id="xu" placeholder="Unidade (un, sc, m³…)" aria-label="Unidade"></div><button class="btn" data-a="xadd">Adicionar produto</button><div class="msg err" id="m1"></div></div><p class="muted" style="margin-bottom:8px">Defina mínimo (para o aviso “baixo”), custo e preço de venda. Só produtos com preço aparecem na tela de vendas.</p>';
  return '<div class="note" style="margin-bottom:12px">Edite nome, unidade, mínimo, custo e preço direto nos campos. Para cadastrar um item novo, use a aba “+ Novo item”.</div><div class="card">'+S.items.map(function(it){function f(k,v,ph){return '<input data-xid="'+it.id+'" data-xf="'+k+'" inputmode="'+(k==='unit'?'text':'decimal')+'" value="'+esc(v)+'" placeholder="'+ph+'" aria-label="'+ph+'">'}
    return '<div class="irow"><input data-xid="'+it.id+'" data-xf="name" value="'+esc(it.name)+'" aria-label="Nome"><div class="sub">'+f('unit',it.unit,'Unid.')+f('min',it.min>0?fq(it.min):'','Mínimo')+f('cost',it.cost>0?fm(it.cost):'','Custo R$')+f('price',it.price>0?fm(it.price):'','Venda R$')+'<button class="rm" data-a="xdel" data-id="'+it.id+'" data-label="Excluir">Excluir</button></div></div>'}).join('')+'</div>';
}

/* ---------- HISTÓRICO ---------- */
function historico(){
  if(!S.days.length)return '<div class="note">Nenhum caixa fechado ainda. Use “Fechar caixa” ao fim do expediente.</div>'+backup();
  var M={};S.days.forEach(function(d){var t=totals(d.pays,d.fundo),k=new Date(d.since),key=k.getFullYear()+'-'+String(k.getMonth()+1).padStart(2,'0'),o=M[key]||(M[key]={i:0,o:0,n:0});o.i+=t.inn;o.o+=t.out;o.n++});
  var ms=Object.keys(M).sort().reverse().map(function(k){var p=k.split('-'),o=M[k];return '<div class="item"><div><b>'+p[1]+'/'+p[0]+'</b><small>'+o.n+' caixa'+(o.n===1?'':'s')+' · saídas '+brl(r2(o.o))+'</small></div><b>'+brl(r2(o.i))+'</b></div>'}).join('');
  var days=S.days.map(function(d){var t=totals(d.pays,d.fundo),op2=openDay===d.id;
    return '<div class="irow"><button class="item" style="width:100%;background:none;border:0;border-bottom:0;text-align:left;padding:0" data-a="day" data-id="'+d.id+'" aria-expanded="'+op2+'"><span><b>'+dt(d.since)+'</b><small>'+hm(d.since)+' às '+hm(d.until)+' · '+d.pays.length+' lançamentos</small></span><span class="v"><b>'+brl(t.inn)+'</b><small>saídas '+brl(t.out)+'</small></span></button>'+
    (op2?'<div class="panel">'+METHODS.map(function(k){return '<div class="item" style="padding:6px 0"><span>'+k+'</span><b>'+brl(t.m[k])+'</b></div>'}).join('')+'<div class="item" style="padding:6px 0"><span>Dinheiro na gaveta ao fechar</span><b>'+brl(t.cash)+'</b></div>'+d.pays.map(function(p){p.hist=1;return payRow(p)}).join('')+'</div>':'')+'</div>'}).join('');
  return '<div class="two"><div><h2 style="margin-top:0">Caixas fechados</h2><div class="card">'+days+'</div></div><div><h2 style="margin-top:0">Por mês</h2><div class="card">'+ms+'</div></div></div>'+backup();
}
function backup(){return exportCard()+'<h2>Backup dos dados</h2><div class="card"><p class="muted">Os dados ficam salvos neste navegador. Copie o backup para guardar ou levar para outro aparelho.</p><textarea id="bk" aria-label="Backup"></textarea><div class="r2"><button class="btn alt" data-a="bkcopy">Copiar backup</button><button class="btn alt" data-a="bkrest" data-label="Restaurar">Restaurar</button></div><div class="msg" id="m1"></div></div>'}

/* ---------- EXPORTAR PLANILHA ---------- */
function exportCard(){
  return '<h2>Exportar para planilha</h2><div class="card"><p class="muted">Gera um arquivo Excel (.xlsx) com o resumo dos caixas, todos os lançamentos, o estoque atual e as movimentações de estoque. Ideal para enviar ao contador.</p><div class="r2"><div><label for="ed1">De (opcional)</label><input id="ed1" type="date"></div><div><label for="ed2">Até (opcional)</label><input id="ed2" type="date"></div></div><small>Sem datas, exporta todo o período. O filtro vale para caixas, lançamentos e movimentações.</small><button class="btn" data-a="xport">Baixar planilha (.xlsx)</button><div class="msg" id="m2"></div></div>';
}
function exportXlsx(){
  var m=document.getElementById('m2');function say(t,c){m.className='msg '+(c||'err');m.textContent=t}
  if(typeof XLSX==='undefined'){say('A biblioteca de planilhas não carregou. Verifique a internet e recarregue a página.');return}
  var d1=document.getElementById('ed1').value,d2=document.getElementById('ed2').value,
      a=d1?new Date(d1+'T00:00:00').getTime():0,z=d2?new Date(d2+'T23:59:59').getTime():Infinity;
  if(d1&&d2&&a>z){say('A data inicial é depois da final.');return}
  function fd(t){return new Date(t).toLocaleDateString('pt-BR')}
  var cx=S.days.map(function(d){return {since:d.since,until:d.until,fundo:d.fundo,pays:d.pays}});
  if(S.open)cx.unshift({since:S.open.since,until:null,fundo:S.open.fundo,pays:S.pays});
  cx.sort(function(x,y){return x.since-y.since});
  var wb=XLSX.utils.book_new();
  function sheet(name,rows,wid,money){
    var ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=wid.map(function(w){return {wch:w}});
    var rg=XLSX.utils.decode_range(ws['!ref']);
    for(var R=1;R<=rg.e.r;R++)money.forEach(function(C){var c=ws[XLSX.utils.encode_cell({r:R,c:C})];if(c&&typeof c.v==='number')c.z='#,##0.00'});
    XLSX.utils.book_append_sheet(wb,ws,name);
  }
  var res=[['Data','Abertura','Fechamento','Fundo de troco','Dinheiro','Pix','Débito','Crédito','Total de entradas','Saídas','Dinheiro na gaveta','Situação']],tt=[0,0,0,0,0,0];
  cx.filter(function(c){return c.since>=a&&c.since<=z}).forEach(function(c){
    var t=totals(c.pays,c.fundo);
    res.push([fd(c.since),hm(c.since),c.until?hm(c.until):'—',c.fundo,t.m['Dinheiro'],t.m['Pix'],t.m['Débito'],t.m['Crédito'],t.inn,t.out,t.cash,c.until?'Fechado':'Em andamento']);
    [t.m['Dinheiro'],t.m['Pix'],t.m['Débito'],t.m['Crédito'],t.inn,t.out].forEach(function(v,i){tt[i]=r2(tt[i]+v)});
  });
  res.push(['TOTAL','','','',tt[0],tt[1],tt[2],tt[3],tt[4],tt[5],'','']);
  sheet('Resumo dos caixas',res,[12,10,11,14,12,12,12,12,17,12,18,14],[3,4,5,6,7,8,9,10]);
  var lan=[];
  cx.forEach(function(c){c.pays.forEach(function(p){if(p.ts<a||p.ts>z)return;var s=p.type==='in';
    lan.push([p.ts,fd(p.ts),hm(p.ts),fd(c.since),s?'Venda':'Saída',s?p.method:'Dinheiro',s?'':(p.cat||''),p.desc||'',(p.items||[]).map(function(i){return fq(i.q)+' '+i.u+' '+i.n}).join('; '),s?p.value:0,s?0:p.value])})});
  lan.sort(function(x,y){return x[0]-y[0]});
  sheet('Lançamentos',[['Data','Hora','Caixa do dia','Tipo','Forma de pagamento','Motivo da saída','Cliente / descrição','Itens vendidos','Entrada (R$)','Saída (R$)']].concat(lan.map(function(r){return r.slice(1)})),[12,8,12,9,18,20,28,40,14,14],[8,9]);
  var est=S.items.map(function(it){var n=S.stock[it.id]||0;return [it.name,it.cat,it.unit,n,it.min||0,low(it)?'Abaixo do mínimo':'OK',it.cost||0,it.price||0,r2(n*(it.cost||0)),r2(n*(it.price||0))]});
  est.push(['TOTAL','','','','','','','',r2(est.reduce(function(t,r){return t+r[8]},0)),r2(est.reduce(function(t,r){return t+r[9]},0))]);
  sheet('Estoque atual',[['Produto','Categoria','Unidade','Quantidade','Mínimo','Situação','Custo unit. (R$)','Preço de venda (R$)','Valor em estoque - custo (R$)','Valor em estoque - venda (R$)']].concat(est),[32,22,9,12,10,18,15,18,26,26],[6,7,8,9]);
  var mov=S.movs.filter(function(x){return x.ts>=a&&x.ts<=z}).map(function(x){return [fd(x.ts),hm(x.ts),x.name,TL[x.type]||x.type,x.delta,x.unit||'',x.paid||0,x.note||'']});
  sheet('Movimentações',[['Data','Hora','Produto','Tipo','Quantidade (+/−)','Unidade','Valor pago (R$)','Observação']].concat(mov),[12,8,32,12,16,9,15,36],[6]);
  var buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  var cl=window.claude&&window.claude.use?window.claude.use('downloads'):Promise.resolve(null);
  cl.then(function(dl){
    if(!dl){say('O download de arquivos não está disponível neste modo de visualização.');return}
    return dl.save({filename:'tico-caixa-estoque-'+new Date().toISOString().slice(0,10)+'.xlsx',data:buf}).then(function(){say('Planilha gerada.','ok')},function(e){say(e&&e.code==='declined'?'Download cancelado.':'Não foi possível salvar o arquivo.')});
  });
}

/* ---------- MENU INICIAL ---------- */
function home(){
  var nl=S.items.filter(low).length,T=S.open?totals(S.pays,S.open.fundo):null;
  return '<div class="home"><div class="logo"><img src="'+LOGO+'" alt="Tico Material de Construção Ltda"></div><h1>Painel da loja</h1><p class="muted">Escolha uma área para começar.</p></div>'+
  '<div class="hgrid"><a class="hbtn" href="#caixa"><b>Controle de caixa</b><span>'+(T?'Aberto · '+brl(T.cash)+' na gaveta':'Caixa fechado')+'</span></a>'+
  '<a class="hbtn" href="#estoque"><b>Controle de estoque</b><span>'+S.items.length+' produtos'+(nl?' · '+nl+' abaixo do mínimo':'')+'</span></a></div>';
}

/* ---------- render e eventos ---------- */
function render(){
  document.getElementById('nav').innerHTML=view==='home'?'':[['','Menu'],['caixa','Caixa'],['estoque','Estoque'],['historico','Histórico']].map(function(t){return '<a href="#'+t[0]+'"'+(view===t[0]?' aria-current="page"':'')+'>'+t[1]+'</a>'}).join('');
  app.innerHTML=view==='home'?home():view==='estoque'?estoque():view==='historico'?historico():caixa();
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,d=b.dataset;
  if(a==='open'){var f=document.getElementById('fundo').value.trim(),v=f===''?0:pv(f);if(v===null||v<0){document.getElementById('m1').textContent='Valor inválido.';return}S.open={since:Date.now(),fundo:r2(v)};S.pays=[];save();render()}
  else if(a==='close'){if(arm(b))return;S.days.unshift({id:uid(),since:S.open.since,until:Date.now(),fundo:S.open.fundo,pays:S.pays});S.open=null;S.pays=[];cart=[];save();render();toast('Caixa fechado e arquivado.')}
  else if(a==='tab'){tab=d.t;render()}
  else if(a==='meth'){meth=d.m;render()}
  else if(a==='addcart')addCart();
  else if(a==='rmcart'){cart=cart.filter(function(c){return c.id!==d.id});render()}
  else if(a==='sell')sell();
  else if(a==='spend')spend();
  else if(a==='rmpay'){if(arm(b))return;rmPay(d.id)}
  else if(a==='st'){st=d.t;op=null;render()}
  else if(a==='sa'){op=op&&op.id===d.id&&op.t===d.t?null:{id:d.id,t:d.t};sx={q:'',n:'',p:'',pay:true};render();var i=document.getElementById('sq2');if(i)i.focus()}
  else if(a==='sok')confirmMove();
  else if(a==='nadd')newItem();
  else if(a==='xport')exportXlsx();
  else if(a==='xdel'){if(arm(b))return;S.items=S.items.filter(function(i){return i.id!==d.id});delete S.stock[d.id];cart=cart.filter(function(c){return c.id!==d.id});save();render()}
  else if(a==='day'){openDay=openDay===d.id?'':d.id;render()}
  else if(a==='bkcopy'){var t=document.getElementById('bk');t.value=JSON.stringify(S);t.select();var m=document.getElementById('m1');try{navigator.clipboard.writeText(t.value).then(function(){m.className='msg ok';m.textContent='Backup copiado.'},function(){m.className='msg ok';m.textContent='Selecionado: copie manualmente.'})}catch(x){m.className='msg ok';m.textContent='Selecionado: copie manualmente.'}}
  else if(a==='bkrest'){var m2=document.getElementById('m1');try{var x=JSON.parse(document.getElementById('bk').value);if(!x||!x.items||!x.stock)throw 0;if(arm(b))return;S=x;save();render();toast('Backup restaurado.')}catch(z){m2.className='msg err';m2.textContent='Cole um backup válido na caixa acima.'}}
});
document.addEventListener('input',function(e){
  var t=e.target,id=t.id;
  if(id==='sq'||id==='sv'||id==='sd'||id==='ov'||id==='od')draft[id]=t.value;
  else if(id==='sq2')sx.q=t.value;else if(id==='sp2')sx.p=t.value;else if(id==='sn2')sx.n=t.value;
  else if(id==='q'){q=t.value;document.getElementById('list').innerHTML=stockList()}
});
document.addEventListener('change',function(e){
  var t=e.target,id=t.id;
  if(id==='sp')draft.sp=t.value;else if(id==='oc')draft.oc=t.value;else if(id==='sk2')sx.pay=t.checked;
  else if(t.dataset.xf){var it=item(t.dataset.xid),f=t.dataset.xf;if(!it)return;
    if(f==='name'||f==='unit'){var v=t.value.trim();if(v)it[f]=v;else t.value=it[f]}
    else{var n=t.value.trim()===''?0:pv(t.value);if(n===null||n<0){t.value=it[f]>0?fm(it[f]):'';return}it[f]=f==='min'?r3(n):r2(n)}
    save();toast('Produto atualizado.')}
});
document.getElementById('hl').src=LOGO;window.addEventListener('hashchange',route);route();
})();
</script>
